<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boost</title>
<style>
html {
    overflow-x: hidden;
}
body {
    margin: 0;
    padding: 0 0 20px 0;
    width: 100%;
    overflow-x: hidden;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    font: 15px "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #c8ccd1;
    -webkit-user-select: none;
}
.icon {
    display: block;
    margin: 16px auto 0 auto;
    width: 57px;
    height: 57px;
    border-radius: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6), 0 3px 8px rgba(0,0,0,0.35);
    border: 1px solid rgba(0,0,0,0.15);
}
.card {
    margin: 18px auto 0 auto;
    max-width: 340px;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    background: -webkit-gradient(linear, left top, left bottom, from(#ffffff), to(#fbfbfb));
    border: 1px solid #a8adb3;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 1px 1px rgba(0,0,0,0.08);
}
.device-tag {
    display: block;
    text-align: center;
    padding: 7px 12px;
    font-size: 12px;
    color: #6b7076;
    background: -webkit-gradient(linear, left top, left bottom, from(#f4f5f6), to(#e9ebed));
    border-bottom: 1px solid #d3d6da;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
}
.chart-wrap {
    padding: 12px 10px 6px 10px;
    text-align: center;
}
.chart-wrap img {
    max-width: 100%;
    height: auto;
}
.stat-row {
    display: block;
    text-align: center;
    padding: 4px 0 14px 0;
    color: #6b7076;
    font-size: 12px;
}
.stat-row strong {
    font-size: 20px;
    display: block;
    line-height: 1.3;
}
.stat-row .green { color: #3d8b3d; text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
.stat-row .red { color: #c62828; }
code {
    font-size: 12px;
    background: #eef0f2;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid #d3d6da;
}
</style>
</head>
<body>

<img class="icon" src="icon.png" alt="boost icon">

<div class="card">
    <span class="device-tag">iPhone 4, iOS 6.1.3, 15 runs each</span>

    <div class="chart-wrap">
<img src="chart.svg" width="300" height="200" alt="benchmark chart jit 15 seconds and no jit 39 seconds">
    </div>

    <span class="stat-row">
        <strong class="green">2.6x faster</strong>
        with Boost
    </span>
</div>

</body>
</html>
