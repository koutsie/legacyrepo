    </div>
    <script>
        function resizeDepictionFrame() {
            try {
                var win = window.frames['depiction'];
                document.getElementById('depictionFrame').style.height = win.document.body.scrollHeight + 'px';
            } catch (e) {}
        }
        if (navigator.userAgent.indexOf('Cydia') !== -1) {
            var navbars = document.getElementsByClassName('navbar');
            if (navbars.length > 0) {
                navbars[0].style.display = 'none';
            }
        }
    </script>
